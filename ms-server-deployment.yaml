apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-server
  template:
    metadata:
      labels:
        app: ms-server
    spec:
      containers:
        - name: ms-server
          image: alexbuttielie/ms-server:server-main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080  # Ajuste conforme a porta que sua app usa
          env:
            - name: EUREKA_SERVER_URL
              value: "http://eureka-server:8081/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-server
spec:
  selector:
    app: ms-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30002
  type: NodePort
